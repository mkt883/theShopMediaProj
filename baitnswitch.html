            *{
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            body{
                display: flex;
                flex-direction:column;
                background-color: black;
                color: white;
                text-align: center;
                overflow: hidden;
                align-items: center;
                justify-content: center;
            }

            #titleCardScreen {
                background: black;
                color: hotpink;
                position: absolute;
                width: 100vw;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 100px;
                text-align: center;
                opacity: .8;
                z-index: 101;
                top: 0;

                animation: burstIn 1s ease;
            }

            @keyframes burstIn {
                0% {opacity: 0;}
                50% {opacity: 0;}
                100% {opacity: .8;};
            }
            @keyframes fadeTitleOut {
                0% {opacity: .8;}
                100% {opacity: 0;};
            }

            .imgs {
                position: absolute;
                padding: 15px;
                max-height: 300px;
                transition: ease 1s;
                filter: drop-shadow(5px 5px 10px #575758);
                z-index: inherit;
            }
            .imgs:hover{
                transform: scale(1.1);
                cursor: pointer;
                z-index: 10;
            }

            #imgsCont{
                position: relative;
                height: 500px;
                width: 700px;
                background-color: rgb(43, 43, 43);
            }

            /*          POP UP STYLING            */
            #pop-up-bg{
                height: 100%;
                width: 100%;

                display: flex;
                z-index: 100;
                position: fixed;

                text-align: center;
                justify-content: center;
                align-items: center;

                /* background: rgba(0, 0, 0, 0.5); */
                opacity: 1;

                animation: fadeIn ease 0.5s;

            }

            @keyframes popIn {
                0% {transform:scale(0);}
                100% {transform:scale(1);};
            }
            @keyframes popOut {
                0% {transform:scale(1);};
                100% {transform:scale(0);}
            }

            .pop-up{
                text-align: center;
                display: flex;
                flex-direction: column;
                height: 300px;
                width: 390px;
                color: black;
                background: #DACDC6;
                padding: 10px 20px;
                border-radius: 2px;
                filter: drop-shadow(10px 10px 4px rgba(0, 0, 0, 0.082));
                overflow-y: scroll;
                overflow-x: hidden;

                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            .pop-up img {
                padding: 5px;
                max-height: 200px;
                max-width: auto;
            }
            .pop-up-style-2{
                text-align: center;
                background: #00047F;
                border-top: solid 5px #F7F7ED;
                border-left: solid 5px #F7F7ED;
                border-bottom: solid 5px #52524C;
                border-right: solid 5px #52524C;
                background: linear-gradient(90deg, rgba(0, 4, 127, 1) 0%, rgba(12, 125, 201, 1) 100%);
                /* padding: 5px; */
                padding: 0;

            .top-bot-borders{

                padding-top: 20px;
            }

                width: 100%;
                height: 100%;
                z-index: 0;
            }
            #bottomHotBar{

            #buttonContainer{

            function scatterImages() {
                let imgs = document.querySelectorAll('.imgs');
                let imgsContainer = document.getElementById("imgsCont");

                imgs.forEach(img => {
                    let maxX = Math.max(0, imgsContainer.clientWidth - img.offsetWidth);
                    let maxY = Math.max(0, imgsContainer.clientHeight - img.offsetHeight);

                    let xPos = Math.random() * maxX;
                    let yPos = Math.random() * maxY;
                    let randomZInNum = Math.floor(Math.random()*90);

                    img.style.left = xPos + 'px';
                    img.style.top = yPos + 'px';
                    img.style.zIndex = randomZInNum;
                });
            }

            window.addEventListener("load", scatterImages);
