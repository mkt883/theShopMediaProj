            #titleCardScreen {

                width: 100vw;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 100px;
                text-align: center;
                opacity: .8;
                z-index: 40;

                animation: burstIn 1s ease;
            }

            @keyframes burstIn {
                0% {opacity: 0;}
                50% {opacity: 0;}
                100% {opacity: .8;};
            }
            @keyframes fadeTitleOut {
                0% {opacity: .8;}
                100% {opacity: 0;};
            }

            #centralCol{
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            #optionContainer {
                background: white;
                width: 500px;
                height: auto;
                padding: 40px;
                border-radius: 10px;

                display: flex;
                flex-wrap: wrap;
                flex-direction: row;
                justify-content: center;
                align-items: center;

                filter: drop-shadow(7px 7px 10px rgba(0, 0, 0, 0.082));

                /* display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px; */
            }

            .qOption{
                border: solid 1px #CFD0D4;
                height: 200px;
                width: 200px;
                background: whitesmoke;
                border-radius: 10px;
                margin: 10px;
            }
            .qOption:hover{
                cursor: pointer;
            }
            .qOption img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .qOption p {
                position: absolute;
                color: white;
            }

            /*          POP UP STYLING            */
            #pop-up-bg{
                height: 100%;
                width: 100%;

                display: flex;
                z-index: 200;
                position: fixed;

                text-align: center;
                justify-content: center;
                align-items: center;

                background: rgba(0, 0, 0, 0.5);
                opacity: 1;

                animation: fadeIn ease 0.5s;

            }

            @keyframes fadeIn {
                0% {opacity: 0;}
                100% {opacity: 1;};
            }
            @keyframes fadeOut {
                0% {opacity: 1;}
                100% {opacity: 0;};
            }

            .pop-up{
                display: flex;
                flex-direction: column;
                height: 600px;
                width: 780px;
                color: #4C7193;
                background: white;
                padding: 20px 40px;
                border-radius: 10px;
                filter: drop-shadow(10px 10px 4px rgba(0, 0, 0, 0.082));

                overflow-y: scroll;
                font-family: sans-serif;
            }

            .top-bot-borders{
                border-top: solid 1.5px #11111120;
                padding-top: 20px;
            }

            #homeButton{
                color: white;
                background: #1877F2;
                border: none;
                border-radius: 5px;
                padding: 10px 50px;
                transition: .2s ease;
            }
            #homeButton:hover{

            let counter = 0;

            function cycleThroughQs(){
                if (counter < 10){
                    counter++;
                document.getElementById("headerText").innerHTML = qArray[counter];
                document.getElementById("ans1").innerHTML = ans1Code[counter];
                document.getElementById("ans2").innerHTML = ans2Code[counter];
                document.getElementById("ans3").innerHTML = ans3Code[counter];
                document.getElementById("ans4").innerHTML = ans4Code[counter];
                }else if(counter == 10) {
                    openPopUp();
                }
            }

            function selectAnswer(answerNumber){

                let currentQuestion = counter + 1;

                if(scoringMap[currentQuestion] && scoringMap[currentQuestion][answerNumber]){

                    let effects = scoringMap[currentQuestion][answerNumber];

                    for(let trait in effects){

                        if(playerProfile[trait] === undefined){
                            playerProfile[trait] = 0;
                        }

                        playerProfile[trait] += effects[trait];
                    }
                }

                console.log(playerProfile);

                cycleThroughQs();
            }

                }

                if(playerProfile.impulsivity >= 5){
                    text += `<p>• Likely to make spontaneous online decisions before reviewing terms.</p>`;
                }

                if(playerProfile.socialValidation >= 4){
                    text += `<p>• Vulnerable to peer comparison, influencer recommendation, and social trend targeting.</p>`;
                }

                if(playerProfile.consumerism >= 4){
                    text += `<p>• Flagged as a strong discretionary spending candidate.</p>`;
                }

                if(playerProfile.surveillanceComfort >= 4){
                    text += `<p>• Unlikely to challenge consent requests, cookies, or default privacy permissions.</p>`;
                }

                if(playerProfile.nostalgia >= 3){
                    text += `<p>• Responsive to sentimental and memory-triggered campaigns.</p>`;
                }

                if(playerProfile.compliance >= 4){
                    text += `<p>• Demonstrates passive agreement behaviour in guided interfaces.</p>`;
                }
                text += `
                    <br>
                    <div class="card">
                        <div class="card-body">
                            <canvas id="profileChart"></canvas>
                        </div>
                    </div>
                    <br>
                `
                text += `

                    <p>Your online behaviour is highly predictable and commercially exploitable.</p>
                    <br>
                    <p><em>None of these questions measured your personality.<br>They measured how easy you are to profile.</em></p>
                    <br>
                `;

                return text;
            }

                const myChart = new Chart('profileChart', {

                    data: {

                        datasets: [{

                            backgroundColor: 'blue',
                            data: dataArray
                        }]
                    },
                    options: {
                        datasets: {

                                borderRadius: 5
                                // circumference: 10
                            }

            `;

            }
